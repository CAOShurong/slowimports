name: Release

# Publishing is triggered by pushing a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Authentication uses PyPI's trusted publishing (OpenID Connect), so there is
# no API token stored anywhere in this repository. GitHub proves to PyPI which
# workflow, in which repo, is asking to publish, and PyPI checks that against
# the publisher it was told to trust. Nothing long-lived exists to leak.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before publishing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Deliberately run against a bare interpreter: a release must not depend
      # on anything the core claims not to need.
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*

      # The tag and the packaged version must agree, or users end up with a
      # v0.2.0 tag that installs 0.1.0.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(ls dist/*.tar.gz | sed -E 's/.*slowimports-(.*)\.tar\.gz/\1/')
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/slowimports
    permissions:
      id-token: write # the OIDC token PyPI verifies; no secret involved
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach distributions to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
