name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The core has no dependencies and the suite is standard-library only.
      # Running against a bare interpreter is what keeps it that way.
      - name: Test with nothing installed
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Install and test the console script
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          slowimports --version
          slowimports -c 'import json' --color none
          slowimports examples/slow_cli.py --advice --color none | tee /tmp/advice.txt
          # The example exists to have something to advise about; if the
          # analyser stops finding it, the tool has regressed.
          grep -q "unittest.mock" /tmp/advice.txt

  docs:
    name: README is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pillow
      # The figures render from a committed profile, so this is deterministic.
      - run: python docs/build_docs.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests docs examples
      - run: ruff format --check src tests docs examples

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
